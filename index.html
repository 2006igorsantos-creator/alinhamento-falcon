<style>

  :root{
    --bg:#f4f5f8;
    --surface:#ffffff;
    --surface-2:#eef0f5;
    --ink:#171a23;

    --accent:#3b3fa8;
    --accent-ink:#ffffff;
    --accent-soft:#ecebfa;
    --success:#157a52;
    --success-soft:#e3f4eb;
    --danger:#b3271e;
    --danger-soft:#fbe9e7;
    --warning:#9a6a10;
    --warning-soft:#fbf0dc;

    color-scheme: light;

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14151c;
      --surface:#1c1e29;

      --ink:#eef0f6;
      --ink-soft:#a6abbd;
      --ink-faint:#767c91;
      --border:#2e3140;
      --accent:#8b8ef0;
      --accent-ink:#14151c;
      --accent-soft:#282a4a;
      --success:#5fd6a4;
      --success-soft:#173328;
      --danger:#ff8b81;
      --danger-soft:#3a1f1e;
      --warning:#e8bb5f;
      --warning-soft:#3a2f14;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14151c;

    --surface-2:#242631;
    --ink:#eef0f6;
    --ink-soft:#a6abbd;
    --ink-faint:#767c91;
    --border:#2e3140;
    --accent:#8b8ef0;
    --accent-ink:#14151c;
    --accent-soft:#282a4a;
    --success:#5fd6a4;
    --success-soft:#173328;
    --danger:#ff8b81;
    --danger-soft:#3a1f1e;
    --warning:#e8bb5f;
    --warning-soft:#3a2f14;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Public Sans', system-ui, -apple-system, sans-serif;
    font-size:15px; line-height:1.5;
  }
  h1,h2,h3,.display{ font-family:'Manrope', system-ui, sans-serif; text-wrap:balance; }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .shell{ max-width:1180px; margin:0 auto; padding:28px 20px 64px; }

  header.top{
    display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:space-between;
    padding-bottom:20px; margin-bottom:24px; border-bottom:1px solid var(--border);
  }
  header.top h1{ font-size:26px; font-weight:800; margin:0 0 4px; letter-spacing:-.01em; }
  header.top p{ margin:0; color:var(--ink-soft); font-size:14px; max-width:46ch; }
  .month-picker{ display:flex; align-items:center; gap:8px; }
  .month-picker label{ font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
  select{
    font:inherit; font-weight:600; color:var(--ink); background:var(--surface);
    border:1px solid var(--border); border-radius:8px; padding:8px 12px; cursor:pointer;
  }

  .layout{ display:grid; grid-template-columns: 220px 1fr; gap:24px; align-items:start; }

  .client-nav{ position:sticky; top:16px; display:flex; flex-direction:column; gap:18px; min-width:0; }
  .client-group h2{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);
    font-weight:700; margin:0 0 8px; padding-left:2px;
  }
  .client-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .client-list button{
    all:unset; cursor:pointer; display:block; width:100%; padding:9px 12px; border-radius:8px;
    font-size:14px; font-weight:600; color:var(--ink-soft);
  }
  .client-list button:hover{ background:var(--surface-2); color:var(--ink); }
  .client-list button.active{ background:var(--accent-soft); color:var(--accent); }
  .empty-nav{ font-size:13px; color:var(--ink-faint); padding:8px 2px; }

  /* Mobile: a barra lateral fixa (sticky) de clientes brigava com o conteúdo
     principal em telas estreitas (o navegador mobile mede o viewport de um
     jeito que faz o sticky "flutuar" por cima do conteúdo em vez de empurrar
     pra baixo). Em telas pequenas ela vira uma faixa de chips horizontal,
     sem sticky, sempre acima do conteúdo do cliente. */
  @media (max-width: 760px){
    .layout{ grid-template-columns: 1fr; gap:16px; }
    .client-nav{ position:static; gap:12px; }
    .client-list{ flex-direction:row; flex-wrap:nowrap; overflow-x:auto; gap:8px; padding:2px 2px 6px; -webkit-overflow-scrolling:touch; }
    .client-list li{ flex:0 0 auto; }
    .client-list button{ width:auto; white-space:nowrap; padding:8px 14px; border:1px solid var(--border); }
    .client-list button.active{ border-color:var(--accent); }
  }

  main{ min-width:0; }

  .client-header{
    display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:18px;
  }
  .client-header h2{ font-size:21px; margin:0; font-weight:800; }
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.05em; padding:4px 9px; border-radius:100px;
  }
  .badge.type-inside{ background:var(--accent-soft); color:var(--accent); }
  .badge.type-ecom{ background:var(--warning-soft); color:var(--warning); }
  .badge.type-leads{ background:var(--surface-2); color:var(--ink-soft); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow);
  }

  .goal-strip{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:0;
    margin-bottom:22px; overflow:hidden;
  }
  .goal-strip .stat{ padding:14px 16px; border-right:1px solid var(--border); }
  .goal-strip .stat:last-child{ border-right:none; }
